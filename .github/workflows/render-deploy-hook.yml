name: Trigger Render API Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for triggering the Render deploy
        required: false
        type: string

jobs:
  deploy:
    name: Call Render deploy hook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deploy hook configuration
        env:
          RENDER_DEPLOY_URL: ${{ vars.RENDER_DEPLOY_URL }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          if [ -z "$RENDER_DEPLOY_URL" ]; then
            echo "Missing GitHub variable: RENDER_DEPLOY_URL"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_KEY" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_KEY"
            exit 1
          fi

      - name: Trigger Render API deploy
        env:
          RENDER_DEPLOY_URL: ${{ vars.RENDER_DEPLOY_URL }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          echo "Triggering Render API deploy..."
          if [ -n "$DEPLOY_REASON" ]; then
            echo "Reason: $DEPLOY_REASON"
          fi
          encoded_key="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RENDER_DEPLOY_KEY"], safe=""))')"
          separator="?"
          case "$RENDER_DEPLOY_URL" in
            *\?*) separator="&" ;;
          esac
          curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_URL}${separator}key=${encoded_key}"
          echo "Render deploy hook accepted."
