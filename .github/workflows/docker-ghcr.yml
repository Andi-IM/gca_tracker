name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: uv run pytest -q api/test_scraper.py

      - name: Build Astro frontend
        run: npm run build

  publish:
    name: Publish GHCR images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy-api:
    name: Deploy Render API
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deploy hook configuration
        env:
          RENDER_DEPLOY_URL: ${{ vars.RENDER_DEPLOY_URL }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          if [ -z "$RENDER_DEPLOY_URL" ]; then
            echo "Missing GitHub variable: RENDER_DEPLOY_URL"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_KEY" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_KEY"
            exit 1
          fi

      - name: Trigger Render API deploy
        env:
          RENDER_DEPLOY_URL: ${{ vars.RENDER_DEPLOY_URL }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          encoded_key="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RENDER_DEPLOY_KEY"], safe=""))')"
          separator="?"
          case "$RENDER_DEPLOY_URL" in
            *\?*) separator="&" ;;
          esac
          response="$(curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_URL}${separator}key=${encoded_key}")"
          echo "$response"
          echo "Render deploy hook accepted."

      - name: Verify production API
        env:
          RENDER_PRODUCTION_API_URL: ${{ vars.RENDER_PRODUCTION_API_URL || 'https://api-sha-58a4305.onrender.com' }}
          SMOKE_PROFILE_URL: https://www.skills.google/public_profiles/58ff4ba8-9292-4ec6-8f16-ee568499d4fb
        run: |
          set -euo pipefail
          encoded_profile="$(SMOKE_PROFILE_URL="$SMOKE_PROFILE_URL" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SMOKE_PROFILE_URL"], safe=""))')"
          endpoint="${RENDER_PRODUCTION_API_URL%/}/api/scrape?url=${encoded_profile}"
          echo "Waiting for Render API to serve the new image..."

          for attempt in $(seq 1 30); do
            response="$(curl --fail --show-error --silent --location "$endpoint" || true)"
            if [ -n "$response" ]; then
              safe_spaces_in_badges="$(RESPONSE="$response" python3 -c 'import json, os; data=json.loads(os.environ["RESPONSE"]); badges=[b.get("name") for b in data.get("completed_skill_badges", [])]; print("Safe Spaces" in badges)' 2>/dev/null || true)"
              arcade_games_count="$(RESPONSE="$response" python3 -c 'import json, os; data=json.loads(os.environ["RESPONSE"]); print(int(data.get("arcade_games_completed", 0)))' 2>/dev/null || true)"
              has_completed_badges="$(RESPONSE="$response" python3 -c 'import json, os; data=json.loads(os.environ["RESPONSE"]); print("completed_skill_badges" in data)' 2>/dev/null || true)"

              if [ "$safe_spaces_in_badges" = "False" ] && [ "$has_completed_badges" = "True" ] && [ "$arcade_games_count" -ge 10 ] 2>/dev/null; then
                echo "Production API verified: August arcade games loaded and Safe Spaces is not counted as a skill badge."
                exit 0
              fi

              echo "Attempt ${attempt}/30: API not updated yet; arcade_games_completed=${arcade_games_count:-unknown}, completed_skill_badges field=${has_completed_badges:-unknown}."
            else
              echo "Attempt ${attempt}/30: API did not return a usable response."
            fi

            sleep 20
          done

          echo "Production API did not serve the expected build after deploy."
          exit 1
